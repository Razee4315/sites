<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian — Time, quietly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200..600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e1420;
    --text:#e8ebf0;
    --muted:rgba(232,235,240,.5);
    --line:rgba(232,235,240,.12);
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

  .nav{position:fixed;inset:0 0 auto;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:26px clamp(16px,4vw,56px);font-size:13px}
  .logo{font-weight:500;letter-spacing:.32em;font-size:13px}
  .nav ul{display:flex;gap:32px;list-style:none;color:var(--muted)}
  .nav ul a:hover{color:var(--text)}

  .hero{position:relative;height:100vh;min-height:680px;overflow:hidden;isolation:isolate}
  .layer{position:absolute;inset:0;will-change:transform}
  .bg{inset:-3%;background:url(images/meridian/bg.webp) center/cover}

  /* the headline is the live time */
  .time{z-index:2;display:grid;place-items:center;pointer-events:none}
  .clock{display:flex;align-items:center;font-weight:200;font-size:clamp(120px,25vw,440px);line-height:1;letter-spacing:-.05em;font-variant-numeric:tabular-nums;margin-top:-4vh;
    color:#dfe4ec;-webkit-mask-image:linear-gradient(180deg,#000 35%,rgba(0,0,0,.28));mask-image:linear-gradient(180deg,#000 35%,rgba(0,0,0,.28));opacity:0;animation:fade 1.6s .2s forwards}
  .digit{display:inline-block;height:1em;overflow:hidden;width:.62em;text-align:center}
  .strip{display:flex;flex-direction:column;transition:transform 1.1s var(--ease)}
  .strip span{height:1em;line-height:1em}
  .colon{width:.3em;text-align:center;animation:blink 2s steps(1) infinite;position:relative;top:-.06em}
  @keyframes blink{50%{opacity:.25}}

  .obj{z-index:3;display:grid;place-items:center;pointer-events:none}
  .watch{position:relative;height:min(94vh,980px);aspect-ratio:2/3;margin-top:4vh;opacity:0;transform:translateY(50px);animation:up 1.8s .5s var(--ease) forwards}
  .watch img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 50px 60px rgba(0,0,0,.55))}
  /* glint that only lands on the watch, masked by its own silhouette */
  .glint{position:absolute;inset:0;-webkit-mask:url(images/meridian/subject.webp) center/contain no-repeat;mask:url(images/meridian/subject.webp) center/contain no-repeat;
    background:radial-gradient(circle at var(--gx,30%) var(--gy,30%),rgba(255,255,255,.55),rgba(160,190,255,.12) 18%,transparent 34%);mix-blend-mode:screen}
  @keyframes up{to{opacity:1;transform:none}}
  @keyframes fade{to{opacity:1}}

  .ui{z-index:5;pointer-events:none}
  .ui > *{pointer-events:auto}
  .cities{position:absolute;left:50%;top:clamp(90px,14vh,140px);translate:-50% 0;display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:99px;font-size:12px;opacity:0;animation:fade 1s 1s forwards;backdrop-filter:blur(10px)}
  .cities button{padding:8px 16px;border-radius:99px;color:var(--muted);transition:all .4s var(--ease)}
  .cities button[aria-pressed="true"]{background:var(--text);color:var(--bg)}

  .copy{position:absolute;left:clamp(16px,4vw,56px);bottom:clamp(28px,7vh,64px);max-width:290px;opacity:0;animation:fade 1s 1.3s forwards}
  .eyebrow{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
  .copy h2{font-weight:300;font-size:26px;letter-spacing:-.02em;line-height:1.2;margin:12px 0 10px}
  .copy p{color:var(--muted);font-size:14px;line-height:1.6}

  .side{position:absolute;right:clamp(16px,4vw,56px);bottom:clamp(28px,7vh,64px);text-align:right;opacity:0;animation:fade 1s 1.5s forwards}
  .meta{display:grid;grid-template-columns:auto auto;gap:6px 22px;font-size:12px;margin-bottom:22px;color:var(--muted);text-align:left}
  .meta b{color:var(--text);font-weight:400;text-align:right}
  .cta{height:48px;padding:0 26px;border-radius:99px;border:1px solid var(--text);font-size:13px;letter-spacing:.02em;transition:all .4s var(--ease);min-width:190px}
  .cta:hover{background:var(--text);color:var(--bg)}
  .cta.done{background:var(--text);color:var(--bg)}
  .tz{position:absolute;left:50%;top:calc(clamp(90px,14vh,140px) + 54px);translate:-50% 0;font-size:12px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;opacity:0;animation:fade 1s 1.7s forwards;font-variant-numeric:tabular-nums}

  @media (max-width:860px){
    .nav ul{display:none}
    .clock{font-size:31vw;margin-top:-14vh}
    .watch{height:52vh;margin-top:-10vh}
    .cities{top:84px;white-space:nowrap}
    .cities button{padding:8px 12px}
    .copy{bottom:150px}
    .copy p,.meta,.tz{display:none}
    .side{left:16px;right:16px;bottom:24px}
    .cta{width:100%}
  }
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}
</style>
</head>
<body>
<nav class="nav">
  <a class="logo" href="#">MERIDIAN</a>
  <ul><li><a href="#">Collection</a></li><li><a href="#">Atelier</a></li><li><a href="#">Boutiques</a></li></ul>
  <a href="#">Account</a>
</nav>

<section class="hero">
  <div class="layer bg" data-d="6"></div>
  <div class="layer time" data-d="14"><div class="clock" id="clock" aria-live="off"></div></div>
  <div class="layer obj" data-d="28">
    <div class="watch" id="watch"><img src="images/meridian/subject.webp" alt="Meridian 38 wristwatch with blue dial"><div class="glint"></div></div>
  </div>

  <div class="layer ui">
    <div class="cities" id="cities">
      <button aria-pressed="true" data-tz="local">Local</button>
      <button aria-pressed="false" data-tz="Europe/London">London</button>
      <button aria-pressed="false" data-tz="America/New_York">New York</button>
      <button aria-pressed="false" data-tz="Asia/Tokyo">Tokyo</button>
    </div>
    <div class="copy">
      <div class="eyebrow">Meridian 38</div>
      <h2>Time, kept quietly.</h2>
      <p>A 38 mm steel case, a sunburst dial in midnight blue, and nothing that doesn't need to be there.</p>
    </div>
    <div class="tz" id="tz"></div>
    <div class="side">
      <div class="meta"><span>Case</span><b>38 mm steel</b><span>Movement</span><b>Automatic, 72 h</b><span>Water</span><b>100 m</b></div>
      <button class="cta" id="reserve">Reserve — $6,400</button>
    </div>
  </div>
</section>

<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* build rolling digits HH:MM */
  const clock = document.getElementById('clock');
  const strips = [];
  [0,1,'c',2,3].forEach(k => {
    if (k === 'c'){ const s = document.createElement('span'); s.className='colon'; s.textContent=':'; clock.append(s); return; }
    const d = document.createElement('span'); d.className='digit';
    const st = document.createElement('span'); st.className='strip';
    st.innerHTML = Array.from({length:10},(_,i)=>`<span>${i}</span>`).join('');
    d.append(st); clock.append(d); strips.push(st);
  });

  let tz = 'local';
  const tzEl = document.getElementById('tz');
  function parts(){
    const opt = {hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false};
    if (tz !== 'local') opt.timeZone = tz;
    const p = Object.fromEntries(new Intl.DateTimeFormat('en-GB', opt).formatToParts(new Date()).map(o => [o.type,o.value]));
    return {h:p.hour.replace('24','00'), m:p.minute, s:p.second};
  }
  function render(){
    const {h,m,s} = parts(), str = h+m;
    strips.forEach((st,i) => st.style.transform = `translateY(${-(+str[i])}em)`);
    const name = tz === 'local' ? Intl.DateTimeFormat().resolvedOptions().timeZone.split('/').pop().replace('_',' ') : tz.split('/').pop().replace('_',' ');
    tzEl.textContent = `${name} · ${h}:${m}:${s}`;
  }
  render(); setInterval(render, 1000);

  document.getElementById('cities').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    document.querySelectorAll('#cities button').forEach(o => o.setAttribute('aria-pressed', o===b));
    tz = b.dataset.tz; render();
  });

  /* parallax + glint following the cursor */
  const layers = [...document.querySelectorAll('[data-d]')], watch = document.getElementById('watch');
  let tx=0,ty=0,cx=0,cy=0;
  addEventListener('pointermove', e => {
    tx=e.clientX/innerWidth-.5; ty=e.clientY/innerHeight-.5;
    const r = watch.getBoundingClientRect();
    watch.style.setProperty('--gx', ((e.clientX-r.left)/r.width*100)+'%');
    watch.style.setProperty('--gy', ((e.clientY-r.top)/r.height*100)+'%');
  });
  (function loop(){
    cx+=(tx-cx)*.05; cy+=(ty-cy)*.05;
    if (!reduce){
      layers.forEach(l => { const d=+l.dataset.d; l.style.transform=`translate3d(${-cx*d*2}px,${-cy*d}px,0)`; });
      watch.style.rotate = `${cx*3}deg`;
    }
    requestAnimationFrame(loop);
  })();

  /* reserve */
  const btn = document.getElementById('reserve');
  btn.addEventListener('click', () => {
    const on = btn.classList.toggle('done');
    btn.textContent = on ? 'Reserved — we\'ll be in touch' : 'Reserve — $6,400';
  });
})();
</script>
</body>
</html>
