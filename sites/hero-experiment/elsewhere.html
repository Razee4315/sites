<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>elsewhere — Break the week</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&display=swap" rel="stylesheet">
<style>
  :root{--text:#fff;--muted:rgba(255,255,255,.7);--line:rgba(255,255,255,.28);--ease:cubic-bezier(.22,1,.36,1)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#1c2128;color:var(--text);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  body.intact #c,body.cracked #c{cursor:crosshair}

  .nav{position:fixed;inset:0 0 auto;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:24px clamp(16px,4vw,48px);font-size:13px;text-shadow:0 1px 12px rgba(0,0,0,.25)}
  .logo{font-weight:700;font-size:18px;letter-spacing:-.03em}
  .nav ul{display:flex;gap:30px;list-style:none;color:var(--muted)}
  .nav-r{display:flex;gap:18px;align-items:center}
  .mute{font-size:12px;color:var(--muted)}

  .pill{position:fixed;left:50%;bottom:clamp(24px,6vh,56px);translate:-50% 0;z-index:5;padding:12px 20px;border-radius:99px;background:rgba(20,24,30,.35);backdrop-filter:blur(12px);border:1px solid var(--line);font-size:13px;display:flex;gap:10px;align-items:center;transition:opacity .4s,translate .5s var(--ease);pointer-events:none}
  .pill i{width:8px;height:8px;border-radius:50%;background:#fff;animation:ping 1.6s infinite}
  @keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,255,255,.7)}100%{box-shadow:0 0 0 12px rgba(255,255,255,0)}}
  body.shattered .pill,body.rebuilding .pill{opacity:0;translate:-50% 20px}

  .monday{position:fixed;left:clamp(16px,4vw,48px);bottom:clamp(24px,6vh,56px);z-index:5;max-width:300px;font-size:14px;line-height:1.6;color:var(--muted);transition:opacity .4s}
  .monday b{display:block;color:#fff;font-weight:500;font-size:20px;margin-bottom:4px}
  body.shattered .monday,body.rebuilding .monday{opacity:0}

  .dest{position:fixed;left:clamp(16px,4vw,48px);right:clamp(16px,4vw,48px);bottom:clamp(24px,6vh,56px);z-index:5;display:flex;justify-content:space-between;align-items:flex-end;gap:24px;pointer-events:none}
  .dest > *{opacity:0;transform:translateY(24px);transition:all .9s var(--ease)}
  body.shattered .dest > *{opacity:1;transform:none;pointer-events:auto}
  body.shattered .dest > *:nth-child(2){transition-delay:.12s}
  .dest h1{font-weight:800;font-size:clamp(56px,9vw,150px);letter-spacing:-.05em;line-height:.85;text-shadow:0 10px 60px rgba(0,0,0,.25)}
  .dest .where{font-size:15px;margin-top:14px;color:var(--muted)}
  .dest .where b{color:#fff;font-weight:500}
  .card{width:300px;padding:20px;border-radius:22px;background:rgba(15,20,26,.3);backdrop-filter:blur(18px) saturate(1.3);border:1px solid var(--line)}
  .card .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px}
  .card .row b{color:#fff;font-weight:500}
  .card .price{font-size:28px;font-weight:300;letter-spacing:-.02em;margin:10px 0 14px}
  .card .price small{font-size:13px;color:var(--muted)}
  .btns{display:flex;gap:8px}
  .go{flex:1;height:46px;border-radius:99px;background:#fff;color:#111;font-weight:600;font-size:14px;transition:transform .3s var(--ease)}
  .go:hover{transform:translateY(-2px)}
  .re{height:46px;padding:0 16px;border-radius:99px;border:1px solid var(--line);font-size:13px}

  .toast{position:fixed;top:84px;left:50%;translate:-50% -12px;opacity:0;z-index:9;padding:12px 18px;border-radius:99px;background:#fff;color:#111;font-size:13px;font-weight:500;transition:all .5s var(--ease);pointer-events:none}
  .toast.show{opacity:1;translate:-50% 0}

  @media (max-width:760px){
    .nav ul{display:none}
    .dest{flex-direction:column;align-items:stretch}
    .card{width:auto}
    .monday{bottom:96px}
  }
</style>
</head>
<body class="intact">
<canvas id="c"></canvas>

<nav class="nav">
  <a class="logo" href="#">elsewhere</a>
  <ul><li><a href="#">Escapes</a></li><li><a href="#">How it works</a></li><li><a href="#">Gift a week</a></li></ul>
  <div class="nav-r"><button class="mute" id="mute">Sound on</button><a href="#">Sign in</a></div>
</nav>

<div class="monday"><b>Same window. Same rain.</b>Same week, again. Unless you break it.</div>
<div class="pill" id="pill"><i></i><span id="pillText">Click the glass</span></div>

<div class="dest">
  <div>
    <h1 id="dName">Bora Bora</h1>
    <div class="where" id="dWhere"><b>French Polynesia</b> · 7 nights · overwater villa</div>
  </div>
  <div class="card">
    <div class="row"><span>Leaves</span><b id="dLeave">Friday, 18:40</b></div>
    <div class="row"><span>Back</span><b>Whenever you like</b></div>
    <div class="price" id="dPrice">€4,280 <small>per person</small></div>
    <div class="btns"><button class="go" id="go">Escape now</button><button class="re" id="rebuild">Rebuild</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const cv = document.getElementById('c'), cx = cv.getContext('2d');
  let W, H, dpr;
  const glass = document.createElement('canvas'), gx = glass.getContext('2d');

  const worlds = [
    {src:'images/shatter/lagoon.webp', name:'Bora Bora', where:'<b>French Polynesia</b> · 7 nights · overwater villa', price:'€4,280'},
    {src:'images/shatter/aurora.webp', name:'Lapland',   where:'<b>Saariselkä, Finland</b> · 5 nights · glass igloo', price:'€2,960'},
    {src:'images/shatter/dunes.webp',  name:'Sahara',    where:'<b>Erg Chebbi, Morocco</b> · 4 nights · desert camp', price:'€1,840'},
  ];
  const imgs = {};
  const load = s => new Promise(r => { const i=new Image(); i.onload=()=>r(i); i.onerror=()=>r(null); i.src=s; });
  let world = 0;

  function cover(img, w, h){
    const s = Math.max(w/img.width, h/img.height), iw=img.width*s, ih=img.height*s;
    return [(w-iw)/2, (h-ih)/2, iw, ih];
  }

  /* the glass: rainy Monday + the word painted on it (so the word shatters too) */
  function paintGlass(){
    glass.width=W; glass.height=H;
    if (imgs.monday){ const r=cover(imgs.monday,W,H); gx.drawImage(imgs.monday,...r); }
    else { gx.fillStyle='#59626d'; gx.fillRect(0,0,W,H); }
    gx.fillStyle='rgba(20,26,34,.18)'; gx.fillRect(0,0,W,H);
    const size = Math.min(W*.19, H*.34);
    gx.font = `900 ${size}px Inter, sans-serif`; gx.textAlign='center'; gx.textBaseline='middle';
    if ('letterSpacing' in gx) gx.letterSpacing = `${-size*.05}px`;
    gx.fillStyle='rgba(255,255,255,.9)';
    gx.fillText('MONDAY.', W/2, H*.46);
    gx.font = `400 ${Math.max(13*dpr, size*.07)}px Inter, sans-serif`;
    if ('letterSpacing' in gx) gx.letterSpacing = `${size*.01}px`;
    gx.fillStyle='rgba(255,255,255,.7)';
    gx.fillText('again.', W/2, H*.46 + size*.62);
  }

  function resize(){
    dpr = Math.min(2, devicePixelRatio);
    W = cv.width = Math.round(innerWidth*dpr); H = cv.height = Math.round(innerHeight*dpr);
    paintGlass();
    if (state !== 'intact' && state !== 'cracked') { shards = []; setState('intact'); }
  }

  /* ---------------- sound (synthesised, no files) ---------------- */
  let ac = null, muted = false;
  function audio(){ if (!ac) try { ac = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} return ac; }
  function tink(freq, when=0, vol=.15, dur=.25){
    const a = audio(); if (!a || muted) return;
    const o=a.createOscillator(), g=a.createGain(); o.type='sine'; o.frequency.value=freq;
    const t=a.currentTime+when; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.004); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.05);
  }
  function noise(dur, vol, hp=1800){
    const a = audio(); if (!a || muted) return;
    const b=a.createBuffer(1, a.sampleRate*dur, a.sampleRate), d=b.getChannelData(0);
    for (let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);
    const s=a.createBufferSource(), f=a.createBiquadFilter(), g=a.createGain();
    s.buffer=b; f.type='highpass'; f.frequency.value=hp; g.gain.value=vol;
    s.connect(f).connect(g).connect(a.destination); s.start();
  }
  const crackSound = () => { noise(.12,.5,2500); tink(3200,0,.08,.3); tink(4700,.02,.05,.2); };
  const shatterSound = () => { noise(.9,.9,900); for (let i=0;i<26;i++) tink(2500+Math.random()*5000, Math.random()*1.1, .05+Math.random()*.06, .2+Math.random()*.3); };
  document.getElementById('mute').addEventListener('click', e => { muted=!muted; e.target.textContent = muted ? 'Sound off' : 'Sound on'; });

  /* ---------------- state ---------------- */
  let state='intact', impact=null, cracks=[], crackT=0, shards=[], rebuildT=0, flash=0, shake=0, revealT=0;
  function setState(s){ state=s; document.body.className=s; }
  const pillText = document.getElementById('pillText');

  /* cracks: jagged radial lines + broken rings */
  function makeCracks(px,py){
    const lines=[], n=11+Math.random()*5|0;
    for (let i=0;i<n;i++){
      const a=i/n*Math.PI*2+Math.random()*.4, len=(.25+Math.random()*.9)*Math.max(W,H)*.55;
      const pts=[[px,py]]; let x=px,y=py,ang=a;
      const steps=8+Math.random()*6|0;
      for (let k=0;k<steps;k++){ ang+= (Math.random()-.5)*.5; x+=Math.cos(ang)*len/steps; y+=Math.sin(ang)*len/steps; pts.push([x,y]); }
      lines.push({pts, w:(1.4+Math.random()*1.4)*dpr});
    }
    for (let r of [40,95,170].map(v=>v*dpr*(.8+Math.random()*.4))){
      const pts=[]; const a0=Math.random()*6.28, span=3+Math.random()*2.5;
      for (let k=0;k<=24;k++){ const a=a0+span*k/24, rr=r*(1+(Math.random()-.5)*.18); pts.push([px+Math.cos(a)*rr, py+Math.sin(a)*rr]); }
      lines.push({pts, w:1.1*dpr});
    }
    return lines;
  }

  /* voronoi shards by half-plane clipping */
  function clip(poly, nx, ny, c){
    const out=[];
    for (let i=0;i<poly.length;i++){
      const a=poly[i], b=poly[(i+1)%poly.length];
      const da=a[0]*nx+a[1]*ny-c, db=b[0]*nx+b[1]*ny-c;
      if (da<=0) out.push(a);
      if ((da<0)!==(db<0)){ const t=da/(da-db); out.push([a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t]); }
    }
    return out;
  }
  function makeShards(px,py){
    const sites=[];
    const n = innerWidth<760 ? 46 : 78;
    for (let i=0;i<n;i++){
      if (i < n*.45){ const r=Math.pow(Math.random(),1.6)*Math.min(W,H)*.33, a=Math.random()*6.283; sites.push([px+Math.cos(a)*r, py+Math.sin(a)*r]); }
      else sites.push([Math.random()*W, Math.random()*H]);
    }
    const out=[];
    for (let i=0;i<sites.length;i++){
      let poly=[[-2,-2],[W+2,-2],[W+2,H+2],[-2,H+2]];
      const [sx,sy]=sites[i];
      for (let j=0;j<sites.length && poly.length;j++){
        if (i===j) continue;
        const [tx,ty]=sites[j], nx=tx-sx, ny=ty-sy;
        const c=( (tx*tx+ty*ty) - (sx*sx+sy*sy) )/2;
        poly=clip(poly,nx,ny,c);
      }
      if (poly.length<3) continue;
      let cxm=0, cym=0; poly.forEach(p=>{cxm+=p[0];cym+=p[1];}); cxm/=poly.length; cym/=poly.length;
      const dx=cxm-px, dy=cym-py, d=Math.hypot(dx,dy)+1, near=Math.max(0,1-d/(Math.min(W,H)*.5));
      out.push({
        poly: poly.map(p=>[p[0]-cxm,p[1]-cym]), ox:cxm, oy:cym, x:cxm, y:cym, a:0, s:1,
        vx: dx/d*(2+near*16)*dpr + (Math.random()-.5)*2*dpr,
        vy: dy/d*(2+near*16)*dpr - (2+Math.random()*5)*dpr*(1-near*.3),
        va: (Math.random()-.5)*.12*(1+near*2), vs: near*.02*Math.random(),
        delay: (d/(Math.max(W,H)))*14 + Math.random()*4, alive:true
      });
    }
    return out;
  }

  /* ---------------- input ---------------- */
  let mx=-1, my=-1;
  cv.addEventListener('pointermove', e => { mx=e.clientX*dpr; my=e.clientY*dpr; });
  cv.addEventListener('pointerdown', e => {
    audio(); if (ac && ac.state==='suspended') ac.resume();
    const px=e.clientX*dpr, py=e.clientY*dpr;
    if (state==='intact'){
      impact=[px,py]; cracks=makeCracks(px,py); crackT=0; shake=10*dpr; crackSound();
      setState('cracked'); pillText.textContent='Once more. Harder.';
    } else if (state==='cracked'){
      shards=makeShards(impact[0],impact[1]); flash=1; shake=22*dpr; revealT=0; shatterSound();
      setState('shattered');
    }
  });

  document.getElementById('rebuild').addEventListener('click', () => {
    if (state!=='shattered') return;
    shards.forEach(s => { s.fx=s.x; s.fy=s.y; s.fa=s.a; s.fs=s.s; s.d2=Math.random()*.35; });
    rebuildT=0; setState('rebuilding');
    tink(900,0,.05,.5); tink(1350,.15,.04,.5);
  });
  const toast=document.getElementById('toast'); let tid;
  document.getElementById('go').addEventListener('click', () => {
    toast.textContent=`${worlds[world].name} it is. Pack light, we'll handle the rest.`;
    toast.classList.add('show'); clearTimeout(tid); tid=setTimeout(()=>toast.classList.remove('show'),2600);
  });

  function setWorld(i){
    world=i; const w=worlds[i];
    document.getElementById('dName').textContent=w.name;
    document.getElementById('dWhere').innerHTML=w.where;
    document.getElementById('dPrice').innerHTML=`${w.price} <small>per person</small>`;
  }
  const next=new Date(); next.setDate(next.getDate()+((5-next.getDay()+7)%7||7));
  document.getElementById('dLeave').textContent = next.toLocaleDateString(undefined,{weekday:'long'})+', 18:40';

  /* ---------------- render ---------------- */
  const ease = t => 1-Math.pow(1-t,3);
  function drawWorld(t){
    const im = imgs[world];
    if (!im){ cx.fillStyle='#2a6f86'; cx.fillRect(0,0,W,H); return; }
    const zoom = 1.12 - .12*ease(Math.min(1,revealT/2.2)) + Math.sin(t*.15)*.008;
    const r=cover(im,W,H), cxp=W/2, cyp=H/2;
    cx.save(); cx.translate(cxp,cyp); cx.scale(zoom,zoom); cx.translate(-cxp,-cyp); cx.drawImage(im,...r); cx.restore();
  }
  function poly(p){ cx.beginPath(); cx.moveTo(p[0][0],p[0][1]); for (let i=1;i<p.length;i++) cx.lineTo(p[i][0],p[i][1]); cx.closePath(); }

  let last=performance.now();
  function frame(now){
    if (cv.width !== Math.round(innerWidth*Math.min(2,devicePixelRatio))) resize();
    const dt=Math.min(.05,(now-last)/1000), k=dt*60; last=now;
    const t=now/1000;
    cx.save();
    if (shake>.2){ cx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake); shake*=Math.pow(.86,k); }

    if (state==='intact' || state==='cracked'){
      cx.drawImage(glass,0,0);
      // moving reflection on the glass
      const gxp = mx<0 ? W*(.5+Math.sin(t*.4)*.3) : mx;
      const g=cx.createLinearGradient(gxp-W*.25,0,gxp+W*.25,H*.6);
      g.addColorStop(0,'rgba(255,255,255,0)'); g.addColorStop(.5,'rgba(255,255,255,.07)'); g.addColorStop(1,'rgba(255,255,255,0)');
      cx.fillStyle=g; cx.fillRect(0,0,W,H);
      if (state==='cracked'){
        crackT=Math.min(1,crackT+dt*4);
        cx.lineCap='round'; cx.lineJoin='round';
        for (const L of cracks){
          const n=Math.max(2,Math.ceil(L.pts.length*ease(crackT)));
          cx.beginPath(); cx.moveTo(L.pts[0][0],L.pts[0][1]); for (let i=1;i<n;i++) cx.lineTo(L.pts[i][0],L.pts[i][1]);
          cx.strokeStyle='rgba(0,0,0,.35)'; cx.lineWidth=L.w+1.5*dpr; cx.stroke();
          cx.strokeStyle='rgba(255,255,255,.85)'; cx.lineWidth=L.w; cx.stroke();
        }
        const rg=cx.createRadialGradient(impact[0],impact[1],0,impact[0],impact[1],30*dpr);
        rg.addColorStop(0,'rgba(255,255,255,.9)'); rg.addColorStop(1,'rgba(255,255,255,0)');
        cx.fillStyle=rg; cx.beginPath(); cx.arc(impact[0],impact[1],30*dpr,0,6.283); cx.fill();
      }
    } else {
      revealT+=dt;
      drawWorld(t);
      let allHome = state==='rebuilding';
      if (state==='rebuilding') rebuildT+=dt;
      for (const s of shards){
        if (state==='shattered'){
          if (s.delay>0){ s.delay-=k; }
          else {
            s.vy+=.55*dpr*k*.6; s.x+=s.vx*k; s.y+=s.vy*k; s.a+=s.va*k; s.s+=s.vs*k;
            s.vx*=Math.pow(.995,k);
            if (mx>=0){ const dx=s.x-mx, dy=s.y-my, d=Math.hypot(dx,dy); if (d<140*dpr){ s.vx+=dx/d*1.4*dpr; s.vy+=dy/d*1.4*dpr; s.va+=(Math.random()-.5)*.02; } }
          }
          if (s.y > H+400*dpr || s.s>2.6) continue;
        } else {
          const p = Math.min(1, Math.max(0,(rebuildT - s.d2)/1.1)), e=1-Math.pow(1-p,4);
          s.x=s.fx+(s.ox-s.fx)*e; s.y=s.fy+(s.oy-s.fy)*e; s.a=s.fa*(1-e); s.s=s.fs+(1-s.fs)*e;
          if (p<1) allHome=false;
        }
        cx.save();
        cx.translate(s.x,s.y); cx.rotate(s.a); cx.scale(s.s,s.s);
        poly(s.poly); cx.save(); cx.clip(); cx.drawImage(glass,-s.ox,-s.oy);
        const lit = .1 + .25*Math.abs(Math.sin(s.a*2));
        cx.fillStyle=`rgba(255,255,255,${lit*.35})`; cx.fillRect(-W,-H,W*2,H*2);
        cx.restore();
        cx.strokeStyle='rgba(255,255,255,.55)'; cx.lineWidth=1.2*dpr/s.s; cx.stroke();
        cx.restore();
      }
      if (state==='rebuilding' && allHome){
        shards=[]; setState('intact'); pillText.textContent='Click the glass';
        setWorld((world+1)%worlds.length);
      }
      if (flash>0){ cx.fillStyle=`rgba(255,255,255,${flash*.75})`; cx.fillRect(0,0,W,H); flash=Math.max(0,flash-dt*2.2); }
    }
    cx.restore();
    requestAnimationFrame(frame);
  }

  /* ---------------- boot ---------------- */
  resize();
  Promise.all([load('images/shatter/monday.webp'), ...worlds.map(w=>load(w.src))]).then(([m,...ws]) => {
    imgs.monday=m; ws.forEach((im,i)=>imgs[i]=im);
    document.fonts.load('900 100px Inter').finally(paintGlass);
  });
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
