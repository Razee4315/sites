<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESSE — Autumn/Winter 26</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#b9ab9c;
    --cream:#f3ece2;
    --ink:#231d18;
    --muted:rgba(35,29,24,.58);
    --line:rgba(35,29,24,.18);
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

  .nav{position:fixed;inset:0 0 auto;z-index:50;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:26px clamp(16px,4vw,56px);font-size:13px}
  .nav ul{display:flex;gap:28px;list-style:none}
  .logo{font-weight:700;letter-spacing:.4em;padding-left:.4em;font-size:15px}
  .nav .r{justify-self:end}

  .hero{position:relative;height:100vh;min-height:700px;overflow:hidden;isolation:isolate}
  .layer{position:absolute;inset:0;will-change:transform}
  .bg{inset:-3%;background:url(images/esse/bg.webp) center/cover}

  .title{z-index:2;display:flex;justify-content:center;align-items:flex-start;pointer-events:none}
  .title h1{font-weight:800;font-size:clamp(150px,31vw,560px);letter-spacing:-.05em;line-height:.8;color:var(--cream);margin-top:clamp(70px,11vh,120px);display:flex}
  .title h1 span{display:inline-block;clip-path:inset(0 0 100% 0);animation:wipe 1.3s var(--ease) forwards}
  @keyframes wipe{to{clip-path:inset(0 0 0 0)}}

  .obj{z-index:3;display:flex;justify-content:center;align-items:flex-end;pointer-events:none}
  .model{position:relative;height:min(90vh,1000px);aspect-ratio:2/3;margin-left:-8%;opacity:0;transform:translateY(30px);animation:up 1.8s .5s var(--ease) forwards;pointer-events:auto;cursor:none;
    -webkit-mask-image:linear-gradient(180deg,#000 85%,transparent);mask-image:linear-gradient(180deg,#000 85%,transparent)}
  .model img{width:100%;height:100%;object-fit:contain;display:block}
  @keyframes up{to{opacity:1;transform:none}}
  @keyframes fade{to{opacity:1}}

  /* hotspots */
  .spot{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:rgba(243,236,226,.9);display:grid;place-items:center;font-size:16px;font-weight:300;cursor:pointer;opacity:0;animation:fade .8s forwards;transition:transform .3s var(--ease)}
  .spot::before{content:"";position:absolute;inset:-7px;border-radius:50%;border:1px solid rgba(243,236,226,.8);animation:pulse 2.4s infinite}
  .spot:hover{transform:scale(1.15)}
  @keyframes pulse{0%{transform:scale(.8);opacity:1}100%{transform:scale(1.6);opacity:0}}

  /* loupe */
  .loupe{position:fixed;z-index:30;width:190px;height:190px;border-radius:50%;pointer-events:none;border:1px solid rgba(243,236,226,.85);box-shadow:0 20px 50px rgba(35,29,24,.35);
    background-color:var(--bg);background-repeat:no-repeat;transform:translate(-50%,-50%) scale(0);transition:transform .35s var(--ease)}
  .loupe.on{transform:translate(-50%,-50%) scale(1)}
  .loupe span{position:absolute;left:50%;bottom:-28px;translate:-50% 0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--cream);white-space:nowrap}

  .ui{z-index:5;pointer-events:none}
  .ui > *{pointer-events:auto}
  .copy{position:absolute;left:clamp(16px,4vw,56px);bottom:clamp(28px,7vh,64px);max-width:270px;opacity:0;animation:fade 1s 1.3s forwards}
  .season{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .copy h2{font-weight:400;font-size:24px;letter-spacing:-.02em;line-height:1.25;margin:10px 0 18px}
  .cta{height:48px;padding:0 24px;border-radius:99px;background:var(--ink);color:var(--cream);font-size:13px;transition:transform .3s var(--ease)}
  .cta:hover{transform:translateY(-2px)}
  .hint{position:absolute;right:clamp(16px,4vw,56px);bottom:clamp(28px,7vh,64px);font-size:12px;color:var(--muted);text-align:right;line-height:1.7;opacity:0;animation:fade 1s 1.6s forwards}

  /* drawer */
  .scrim{position:fixed;inset:0;z-index:70;background:rgba(35,29,24,.25);opacity:0;pointer-events:none;transition:opacity .5s}
  .drawer{position:fixed;top:0;right:0;bottom:0;z-index:71;width:min(400px,100vw);background:var(--cream);padding:30px;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .7s var(--ease)}
  body.open .scrim{opacity:1;pointer-events:auto}
  body.open .drawer{transform:none}
  .d-top{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
  .d-img{margin:24px 0;aspect-ratio:1;border-radius:6px;background-color:var(--bg);background-repeat:no-repeat}
  .d-name{font-size:20px;font-weight:500;letter-spacing:-.01em}
  .d-price{color:var(--muted);margin:6px 0 4px}
  .d-desc{font-size:13px;line-height:1.6;color:var(--muted);margin-bottom:20px}
  .sizes{display:flex;gap:6px;margin-bottom:auto}
  .sizes button{flex:1;height:42px;border:1px solid var(--line);border-radius:6px;font-size:13px;transition:all .25s}
  .sizes button[aria-pressed="true"]{background:var(--ink);color:var(--cream);border-color:var(--ink)}
  .d-add{height:52px;border-radius:99px;background:var(--ink);color:var(--cream);font-size:14px;margin-top:24px}
  .d-add.ok{background:#4b5a43}

  @media (max-width:860px){
    .nav{grid-template-columns:auto 1fr}
    .nav ul{display:none}
    .logo{justify-self:start}
    .title h1{font-size:29vw;margin-top:110px}
    .model{height:auto;width:112vw;margin-left:-16%;margin-bottom:9vh}
    .hint,.loupe{display:none}
    .copy{left:16px;right:16px;max-width:none;bottom:20px;display:flex;justify-content:space-between;align-items:center}
    .copy h2{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}
</style>
</head>
<body>
<nav class="nav">
  <ul><li><a href="#">Women</a></li><li><a href="#">Men</a></li><li><a href="#">Journal</a></li></ul>
  <a class="logo" href="#">ESSE</a>
  <a class="r" href="#">Bag (<span id="bag">0</span>)</a>
</nav>

<section class="hero">
  <div class="layer bg" data-d="5"></div>
  <div class="layer title" data-d="12"><h1 aria-label="ESSE"><span style="animation-delay:.1s">E</span><span style="animation-delay:.2s">S</span><span style="animation-delay:.3s">S</span><span style="animation-delay:.4s">E</span></h1></div>
  <div class="layer obj" data-d="22">
    <div class="model" id="model">
      <img id="modelImg" src="images/esse/subject.webp" alt="Model wearing an oversized camel wool coat and cream knit">
      <button class="spot" style="left:22%;top:64%;animation-delay:2s" data-i="0" aria-label="Oversized wool coat">+</button>
      <button class="spot" style="left:53%;top:52%;animation-delay:2.2s" data-i="1" aria-label="Rib knit">+</button>
      <button class="spot" style="left:62%;top:26%;animation-delay:2.4s" data-i="2" aria-label="Gold hoop">+</button>
    </div>
  </div>

  <div class="layer ui">
    <div class="copy">
      <div><div class="season">Autumn / Winter 26 — Look 04</div><h2>Built to be lived in, not looked after.</h2></div>
      <button class="cta" id="shop">Shop the look</button>
    </div>
    <div class="hint">Hover to look closer<br>Tap + to shop</div>
  </div>
</section>

<div class="loupe" id="loupe"><span>Double-faced wool</span></div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" aria-label="Product">
  <div class="d-top"><span id="dIdx">01 / 03</span><button id="close">Close</button></div>
  <div class="d-img" id="dImg"></div>
  <div class="d-name" id="dName"></div>
  <div class="d-price" id="dPrice"></div>
  <p class="d-desc" id="dDesc"></p>
  <div class="sizes" id="sizes"></div>
  <button class="d-add" id="dAdd">Add to bag</button>
</aside>

<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const model = document.getElementById('model'), img = document.getElementById('modelImg');

  /* parallax */
  const layers = [...document.querySelectorAll('[data-d]')];
  let tx=0,ty=0,cx=0,cy=0;
  addEventListener('pointermove', e => { tx=e.clientX/innerWidth-.5; ty=e.clientY/innerHeight-.5; });
  (function loop(){
    cx+=(tx-cx)*.05; cy+=(ty-cy)*.05;
    if (!reduce) layers.forEach(l => { const d=+l.dataset.d; l.style.transform=`translate3d(${-cx*d*2}px,${-cy*d}px,0)`; });
    requestAnimationFrame(loop);
  })();

  /* loupe: 2.6x close-up of the fabric under the cursor */
  const loupe = document.getElementById('loupe'), Z = 2.6;
  model.addEventListener('pointermove', e => {
    if (e.target.closest('.spot')) { loupe.classList.remove('on'); return; }
    const r = img.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    loupe.classList.add('on');
    loupe.style.left = e.clientX+'px'; loupe.style.top = e.clientY+'px';
    loupe.style.backgroundImage = `url(${img.src})`;
    loupe.style.backgroundSize = `${r.width*Z}px ${r.height*Z}px`;
    loupe.style.backgroundPosition = `${-(x*Z-95)}px ${-(y*Z-95)}px`;
    const ry = y/r.height, rx = x/r.width;
    loupe.querySelector('span').textContent = ry < .3 ? 'Look 04' : (rx > .38 && rx < .68 && ry < .9 ? 'Rib knit · cashmere' : 'Double-faced wool');
  });
  model.addEventListener('pointerleave', () => loupe.classList.remove('on'));

  /* products + drawer */
  const items = [
    {name:'Oversized coat', price:'€890', desc:'Double-faced virgin wool, unlined, cut wide through the shoulder. Woven in Biella.', sizes:['XS','S','M','L'], pos:[.22,.64]},
    {name:'Rib crewneck', price:'€320', desc:'Mongolian cashmere in a dense 5×2 rib. Gets softer every winter.', sizes:['XS','S','M','L'], pos:[.53,.55]},
    {name:'Small hoop', price:'€180', desc:'Recycled 18k gold vermeil. Sold individually.', sizes:['One size'], pos:[.62,.26]},
  ];
  let cur = 0;
  const $ = id => document.getElementById(id);
  function open(i){
    cur = i; const it = items[i];
    $('dIdx').textContent = `0${i+1} / 03`; $('dName').textContent = it.name; $('dPrice').textContent = it.price; $('dDesc').textContent = it.desc;
    const d = $('dImg'), w = d.clientWidth || 340;
    d.style.backgroundImage = `url(${img.src})`; d.style.backgroundSize = `${w*2.2}px ${w*2.2*1.5}px`;
    d.style.backgroundPosition = `${-(it.pos[0]*w*2.2 - w/2)}px ${-(it.pos[1]*w*2.2*1.5 - w/2)}px`;
    $('sizes').innerHTML = it.sizes.map((s,k) => `<button aria-pressed="${it.sizes.length===1}">${s}</button>`).join('');
    $('dAdd').textContent = 'Add to bag'; $('dAdd').classList.remove('ok');
    document.body.classList.add('open');
  }
  const close = () => document.body.classList.remove('open');
  document.querySelectorAll('.spot').forEach(s => s.addEventListener('click', () => open(+s.dataset.i)));
  $('shop').addEventListener('click', () => open(0));
  $('close').addEventListener('click', close); $('scrim').addEventListener('click', close);
  addEventListener('keydown', e => e.key === 'Escape' && close());
  $('sizes').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    $('sizes').querySelectorAll('button').forEach(o => o.setAttribute('aria-pressed', o===b));
  });
  let n = 0;
  $('dAdd').addEventListener('click', () => {
    const sel = $('sizes').querySelector('[aria-pressed="true"]');
    if (!sel){ $('sizes').animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:300}); return; }
    $('bag').textContent = ++n; $('dAdd').textContent = `Added — ${sel.textContent}`; $('dAdd').classList.add('ok');
    setTimeout(() => cur < 2 ? open(cur+1) : close(), 900);
  });
})();
</script>
</body>
</html>
