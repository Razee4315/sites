<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRIFT — Expeditions above the clouds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&display=swap" rel="stylesheet">
<style>
  :root{--text:#fbf6f1;--muted:rgba(251,246,241,.62);--line:rgba(251,246,241,.22);--ease:cubic-bezier(.22,1,.36,1)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#0b1220;color:var(--text);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block}

  .nav{position:fixed;inset:0 0 auto;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:24px clamp(16px,4vw,48px);font-size:13px}
  .logo{font-weight:700;letter-spacing:.32em}
  .nav ul{display:flex;gap:30px;list-style:none;color:var(--muted)}
  .nav ul a:hover{color:var(--text)}

  .glass{background:rgba(12,18,32,.28);backdrop-filter:blur(16px) saturate(1.3);border:1px solid var(--line)}
  .copy{position:fixed;left:clamp(16px,4vw,48px);bottom:clamp(24px,6vh,56px);z-index:5;max-width:320px;opacity:0;animation:fade 1.4s 2.2s forwards}
  .eyebrow{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
  .copy h2{font-weight:400;font-size:clamp(22px,2vw,28px);letter-spacing:-.02em;line-height:1.2;margin:10px 0 18px}
  .row{display:flex;gap:10px;align-items:center}
  .cta{height:48px;padding:0 22px;border-radius:99px;background:var(--text);color:#0b1220;font-size:14px;font-weight:500;transition:transform .3s var(--ease)}
  .cta:hover{transform:translateY(-2px)}
  .ghost{height:48px;padding:0 18px;border-radius:99px;font-size:13px;display:flex;align-items:center;gap:8px}
  .ghost i{width:8px;height:8px;border-radius:50%;background:var(--muted);transition:background .3s}
  .ghost[aria-pressed="true"] i{background:#7cf3ff;box-shadow:0 0 10px #7cf3ff}

  .alt{position:fixed;right:clamp(16px,4vw,48px);bottom:clamp(24px,6vh,56px);z-index:5;text-align:right;font-variant-numeric:tabular-nums;opacity:0;animation:fade 1.4s 2.4s forwards}
  .alt b{display:block;font-weight:300;font-size:clamp(34px,3.4vw,48px);letter-spacing:-.03em}
  .alt span{font-size:12px;color:var(--muted)}
  @keyframes fade{to{opacity:1}}

  .sheet{position:fixed;left:50%;bottom:clamp(24px,6vh,56px);z-index:8;width:min(420px,calc(100vw - 32px));border-radius:22px;padding:22px;translate:-50% 20px;opacity:0;pointer-events:none;transition:all .6s var(--ease)}
  .sheet.open{translate:-50% 0;opacity:1;pointer-events:auto}
  .sheet h3{font-weight:500;font-size:18px;margin-bottom:4px}
  .sheet .sub{font-size:13px;color:var(--muted);margin-bottom:16px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
  .chip{padding:8px 14px;border-radius:99px;border:1px solid var(--line);font-size:13px;transition:all .25s}
  .chip[aria-pressed="true"]{background:var(--text);color:#0b1220;border-color:var(--text)}
  .step{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;font-size:14px}
  .step div{display:flex;align-items:center;gap:14px}
  .step button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line)}
  .step b{min-width:16px;text-align:center;font-weight:500}
  .sheet .cta{width:100%}
  .x{position:absolute;right:16px;top:14px;font-size:13px;color:var(--muted)}

  .hint{position:fixed;left:50%;top:50%;translate:-50% 140px;z-index:5;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);opacity:0;animation:hint 4s 2.6s forwards;pointer-events:none}
  @keyframes hint{20%,70%{opacity:1}100%{opacity:0}}

  @media (max-width:760px){
    .nav ul,.alt{display:none}
    .copy{left:16px;right:16px;max-width:none}
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<nav class="nav">
  <a class="logo" href="#">DRIFT</a>
  <ul><li><a href="#">Expeditions</a></li><li><a href="#">Guides</a></li><li><a href="#">Journal</a></li></ul>
  <a href="#">Sign in</a>
</nav>

<div class="hint" id="hint">Move to look around</div>

<div class="copy">
  <div class="eyebrow">Expedition 07 · Dolomites</div>
  <h2>Above the clouds is<br>a quieter world.</h2>
  <div class="row">
    <button class="cta" id="plan">Plan your ascent</button>
    <button class="ghost glass" id="xray" aria-pressed="false"><i></i>Depth vision</button>
  </div>
</div>

<div class="alt"><b><span id="altv" style="font-size:inherit;color:inherit">3,343</span> m</b><span>Punta Penia · sunrise 06:12</span></div>

<div class="sheet glass" id="sheet">
  <button class="x" id="close">Close</button>
  <h3>Plan your ascent</h3>
  <div class="sub">Five days, two mountain huts, one sunrise you'll keep.</div>
  <div class="chips" id="months">
    <button class="chip" aria-pressed="false">June</button><button class="chip" aria-pressed="true">July</button><button class="chip" aria-pressed="false">August</button><button class="chip" aria-pressed="false">September</button>
  </div>
  <div class="step"><span>Climbers</span><div><button id="minus">−</button><b id="people">2</b><button id="plus">+</button></div></div>
  <button class="cta" id="request">Request July · 2 climbers — €3,780</button>
</div>

<script>
(() => {
  const cv = document.getElementById('gl');
  const gl = cv.getContext('webgl', {antialias:false});
  let dpr = Math.min(2, devicePixelRatio);
  let W, H;

  const vs = `attribute vec2 a;varying vec2 v;void main(){v=a*.5+.5;gl_Position=vec4(a,0.,1.);}`;
  const fs = `
  precision highp float;
  varying vec2 v;
  uniform sampler2D photo, depth, title;
  uniform vec2 res, mouse;
  uniform float imgAspect, t, intro, xray, zoom, fx;
  float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
  float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
    return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
  float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<5;i++){s+=a*n(p);p*=2.03;a*=.5;}return s;}
  vec2 cover(vec2 uv){
    float sa=res.x/res.y; vec2 s=sa>imgAspect?vec2(1.,imgAspect/sa):vec2(sa/imgAspect,1.);
    return (uv-.5)*s/zoom+vec2(fx,.5);
  }
  void main(){
    vec2 suv = cover(v); suv.y = 1.-suv.y;
    vec2 off = mouse*vec2(.065,.035);
    float focus = .5;
    // iterative parallax: find source pixel that lands here
    vec2 p = suv;
    for(int i=0;i<8;i++){ float d=texture2D(depth,p).r; p = suv - off*(d-focus); }
    float d = texture2D(depth,p).r;
    vec3 col = texture2D(photo,p).rgb;

    // drifting fog that lives in the cloud layer
    vec2 fp = p*vec2(3.,5.) + vec2(t*.018, 0.) + off*2.;
    float fog = fbm(fp) * fbm(fp*.5 - vec2(t*.01,0.));
    float band = smoothstep(.12,.32,d)*smoothstep(.62,.38,d);
    col = mix(col, vec3(1.,.93,.88), clamp(fog*band*1.1,0.,.55));

    // title living at a depth plane between ridge and mountains
    float td = .62;
    float ta = texture2D(title, suv - off*(td-focus)).a;
    float behind = smoothstep(td+.03, td-.03, d);
    vec3 tcol = mix(vec3(1.,.97,.93), vec3(1.,.86,.75), v.y);
    col = mix(col, tcol, ta*behind*intro*.94);

    // warm sun bloom near the peak, shifting with view
    vec2 sun = vec2(.62,.72) + mouse*vec2(-.02,.01);
    col += vec3(1.,.72,.5) * .25 * exp(-length((v-sun)*vec2(res.x/res.y,1.))*4.);

    // depth vision (x-ray)
    vec3 ramp = mix(vec3(.02,.03,.12), vec3(.1,.95,1.), d);
    ramp += .25*vec3(.4,1.,1.)*smoothstep(.97,1.,fract(d*14. - t*.4));
    col = mix(col, ramp, xray);

    // vignette + grade
    col *= .82 + .18*smoothstep(1.2,.2,length(v-.5));
    col = pow(col, vec3(.96,.98,1.02));
    gl_FragColor = vec4(col,1.);
  }`;
  function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(s));return s;}
  const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);
  const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const aL=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(aL);gl.vertexAttribPointer(aL,2,gl.FLOAT,false,0,0);
  const U = n => gl.getUniformLocation(pr,n);
  const u = {photo:U('photo'),depth:U('depth'),title:U('title'),res:U('res'),mouse:U('mouse'),imgAspect:U('imgAspect'),t:U('t'),intro:U('intro'),xray:U('xray'),zoom:U('zoom'),fx:U('fx')};

  function tex(unit, src){
    const tx=gl.createTexture(); gl.activeTexture(gl.TEXTURE0+unit); gl.bindTexture(gl.TEXTURE_2D,tx);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([0,0,0,0]));
    if (src instanceof HTMLCanvasElement){ gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,src); return tx; }
    const im=new Image(); im.onload=()=>{gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,tx);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,im);loaded++;};
    im.src=src; return tx;
  }
  let loaded=0;
  tex(0,'images/drift/photo.webp'); tex(1,'images/drift/depth.webp');
  gl.uniform1i(u.photo,0); gl.uniform1i(u.depth,1); gl.uniform1i(u.title,2);

  /* title rendered to a canvas, sampled inside the shader at a depth plane */
  const tc = document.createElement('canvas'), tcx = tc.getContext('2d');
  let titleTex;
  function drawTitle(){
    const TW = 2048, TH = 1365;   // same aspect as the photo: title lives in image space
    tc.width = TW; tc.height = TH;
    tcx.clearRect(0,0,TW,TH); tcx.fillStyle='#fff'; tcx.textAlign='center'; tcx.textBaseline='middle';
    // on portrait screens only a slice of the photo is visible: fit the title into it
    const vis = Math.min(1, (innerWidth/innerHeight)/1.5/1.12);
    const size = TW * Math.min(.285, vis*.33);
    tcx.font = `800 ${size}px Inter, sans-serif`;
    if ('letterSpacing' in tcx) tcx.letterSpacing = `${-size*.04}px`;
    tcx.fillText('DRIFT', TW*focusX(), TH*(vis<1 ? .47 : .5));
    gl.activeTexture(gl.TEXTURE2);
    if (!titleTex){ titleTex = gl.createTexture(); }
    gl.bindTexture(gl.TEXTURE_2D,titleTex);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,tc);
  }
  function focusX(){ const vis=Math.min(1,(innerWidth/innerHeight)/1.5/1.12); return vis<1 ? Math.min(.5+(1-vis)*.32, .74) : .5; }
  function resize(){ dpr=Math.min(2,devicePixelRatio); W=cv.width=Math.round(innerWidth*dpr); H=cv.height=Math.round(innerHeight*dpr); gl.viewport(0,0,W,H); }
  addEventListener('resize', () => { resize(); drawTitle(); });
  resize(); drawTitle();
  document.fonts.load('800 100px Inter').finally(drawTitle);

  /* input: mouse, touch, tilt, idle drift */
  let tx=0, ty=0, mx=0, my=0, last=0;
  addEventListener('pointermove', e => { tx=(e.clientX/innerWidth-.5)*2; ty=(e.clientY/innerHeight-.5)*2; last=performance.now(); });
  addEventListener('deviceorientation', e => { if (e.gamma==null) return; tx=Math.max(-1,Math.min(1,e.gamma/25)); ty=Math.max(-1,Math.min(1,(e.beta-45)/25)); last=performance.now(); });

  let xray=0, xrayT=0;
  const xb = document.getElementById('xray');
  xb.addEventListener('click', () => { xrayT = xrayT ? 0 : 1; xb.setAttribute('aria-pressed', !!xrayT); });

  const start = performance.now();
  function frame(now){
    if (cv.width !== Math.round(innerWidth*Math.min(2,devicePixelRatio))) resize();
    const t = (now-start)/1000;
    if (now-last > 2500){ tx = Math.sin(t*.35)*.7; ty = Math.cos(t*.27)*.35; }
    mx += (tx-mx)*.05; my += (ty-my)*.05;
    xray += (xrayT-xray)*.06;
    const intro = Math.min(1, Math.max(0,(t-.6)/1.8)), ease = 1-Math.pow(1-intro,3);
    gl.uniform2f(u.res,W,H); gl.uniform2f(u.mouse,mx,my); gl.uniform1f(u.imgAspect,1.5);
    gl.uniform1f(u.t,t); gl.uniform1f(u.intro,ease); gl.uniform1f(u.xray,xray);
    gl.uniform1f(u.zoom, 1.12 + (1-ease)*.12); gl.uniform1f(u.fx, focusX());
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* altitude ticker */
  const alt = document.getElementById('altv');
  setTimeout(() => { const t0=performance.now(); (function f(n){ const p=Math.min(1,(n-t0)/2200); alt.textContent=Math.round(3343*(1-Math.pow(1-p,4))).toLocaleString(); if(p<1) requestAnimationFrame(f); })(t0); }, 2200);

  /* booking sheet */
  const sheet = document.getElementById('sheet'), req = document.getElementById('request');
  let month='July', people=2;
  const price = () => `Request ${month} · ${people} climber${people>1?'s':''} — €${(1890*people).toLocaleString()}`;
  document.getElementById('plan').addEventListener('click', () => sheet.classList.add('open'));
  document.getElementById('close').addEventListener('click', () => sheet.classList.remove('open'));
  document.getElementById('months').addEventListener('click', e => { const b=e.target.closest('.chip'); if(!b) return; document.querySelectorAll('#months .chip').forEach(o=>o.setAttribute('aria-pressed',o===b)); month=b.textContent; req.textContent=price(); });
  document.getElementById('minus').addEventListener('click', () => { people=Math.max(1,people-1); document.getElementById('people').textContent=people; req.textContent=price(); });
  document.getElementById('plus').addEventListener('click', () => { people=Math.min(8,people+1); document.getElementById('people').textContent=people; req.textContent=price(); });
  req.addEventListener('click', () => { req.textContent = `Requested ✓ — a guide will write within a day`; setTimeout(() => { sheet.classList.remove('open'); req.textContent = price(); }, 2200); });
  addEventListener('keydown', e => e.key==='Escape' && sheet.classList.remove('open'));
})();
</script>
</body>
</html>
